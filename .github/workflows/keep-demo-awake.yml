# Keeps the hosted judge demo (Render free plan) from sleeping after 15 idle minutes.
# GitHub's scheduler can run late under load, so ping every 5 minutes to stay well inside the window.
name: keep-demo-awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors https://unhold-do43.onrender.com/healthz
