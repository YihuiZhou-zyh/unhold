# Render Blueprint for the hosted demo (Dashboard → New → Blueprint → this repo).
# Secrets are entered in the Render dashboard (sync: false) and never committed.
services:
  - type: web
    name: unhold
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: SANDBOX_BUYER_EMAIL
        sync: false
      - key: SANDBOX_BUYER_PASSWORD
        sync: false
